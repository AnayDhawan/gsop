name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 scripts/check_claims.py
      - run: python3 -m unittest discover -s scripts/tests
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Wording audit of the built site
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ > /dev/null && break; sleep 1; done
          python3 scripts/audit_site.py --base http://localhost:3100 --sample-sites 20
